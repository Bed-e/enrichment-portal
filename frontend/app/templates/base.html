<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}IP Enrichment Portal{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>
<body>
  <header>
    <h1>IP Enrichment Portal</h1>
    <p class="tagline">Look up one IP address across threat-intel sources.</p>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p>IP data from <a href="https://ipinfo.io" rel="noopener">IPinfo</a> (CC BY-SA 4.0), Shodan InternetDB, RDAP, Team Cymru, AbuseIPDB, GreyNoise Community and VirusTotal. Educational project, not for commercial use.</p>
  </footer>
</body>
</html>
